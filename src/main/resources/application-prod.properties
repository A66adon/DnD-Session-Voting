# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.ds.dnd.voting=ERROR
logging.level.ds.dnd.voting.security=ERROR
logging.level.org.springframework.scheduling=ERROR
logging.level.org.springframework.web.cors=ERROR

# Auth
app.voting.password=${APP_VOTING_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Memory/Performance Tuning
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

server.tomcat.threads.max=20

app.voting.retention.weeks=10

